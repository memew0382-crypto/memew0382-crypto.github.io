<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Perangkat Pengunjung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }
        .sub {
            color: #a5b4fc;
            margin-bottom: 2rem;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            text-align: left;
        }
        .info-box h3 {
            font-size: 0.9rem;
            color: #93c5fd;
            margin-bottom: 0.3rem;
        }
        .info-box p {
            font-size: 1rem;
            font-weight: 600;
            word-break: break-all;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #818cf8;
        }
        .status {
            display: inline-block;
            background: #10b981;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📱</div>
        <h1>Perangkat Pengunjung</h1>
        <p class="sub">Data terdeteksi otomatis</p>
        
        <div class="status">✅ Terdeteksi!</div>

        <div class="info-box">
            <h3>📡 Nama Perangkat</h3>
            <p id="device-name">— Mendeteksi...</p>
        </div>

        <div class="info-box">
            <h3>🖥️ Sistem Operasi</h3>
            <p id="os-name">—</p>
        </div>

        <div class="info-box">
            <h3>🌐 Browser</h3>
            <p id="browser-name">—</p>
        </div>

        <div class="info-box">
            <h3>📅 Waktu Kunjungan</h3>
            <p id="visit-time">—</p>
        </div>

        <div class="footer">
            © 2026 WebdevFanz — Semua perangkat tercatat otomatis 😏✨
        </div>
    </div>

    <script>
        // Ambil data dari browser
        const userAgent = navigator.userAgent;
        const deviceInfo = document.getElementById('device-name');
        const osInfo = document.getElementById('os-name');
        const browserInfo = document.getElementById('browser-name');
        const timeInfo = document.getElementById('visit-time');

        // Deteksi Sistem Operasi & Merk HP
        let os = 'Tidak Diketahui';
        let device = 'Perangkat Tidak Dikenali';

        if (/Android/.test(userAgent)) {
            os = 'Android';
            if (/Samsung/.test(userAgent)) device = 'Samsung';
            else if (/Redmi|Xiaomi/.test(userAgent)) device = 'Xiaomi / Redmi';
            else if (/Oppo/.test(userAgent)) device = 'Oppo';
            else if (/Vivo/.test(userAgent)) device = 'Vivo';
            else if (/Infinix/.test(userAgent)) device = 'Infinix';
            else if (/Realme/.test(userAgent)) device = 'Realme';
            else if (/Techno/.test(userAgent)) device = 'Techno';
            else if (/Huawei/.test(userAgent)) device = 'Huawei';
            else device = 'HP Android';
        } else if (/iPhone|iPad/.test(userAgent)) {
            os = 'iOS (Apple)';
            device = /iPhone/.test(userAgent) ? 'iPhone' : 'iPad';
        } else if (/Windows/.test(userAgent)) {
            os = 'Windows';
            device = 'Komputer / Laptop';
        } else if (/Mac/.test(userAgent)) {
            os = 'macOS';
            device = 'MacBook / iMac';
        } else if (/Linux/.test(userAgent)) {
            os = 'Linux';
            device = 'Komputer / Laptop';
        }

        // Deteksi Browser
        let browser = 'Tidak Diketahui';
        if (/Edg/.test(userAgent)) browser = 'Microsoft Edge';
        else if (/Chrome/.test(userAgent)) browser = 'Google Chrome';
        else if (/Firefox/.test(userAgent)) browser = 'Mozilla Firefox';
        else if (/Safari/.test(userAgent)) browser = 'Safari';
        else if (/Opera|OPR/.test(userAgent)) browser = 'Opera';

        // Tampilkan hasil
        deviceInfo.textContent = device;
        osInfo.textContent = os;
        browserInfo.textContent = browser;
        
        // Tampilkan waktu kunjungan
        const sekarang = new Date();
        const waktu = sekarang.toLocaleString('id-ID', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        timeInfo.textContent = waktu;
    </script>
</body>
</html>
